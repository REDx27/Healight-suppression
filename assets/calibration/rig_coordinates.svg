<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="990" viewBox="0 0 1040 990" role="img" aria-labelledby="title desc">
<title id="title">Rig world origin and camera directions</title><desc id="desc">Top view shows a screen at Y zero, road cameras facing positive Y and driver camera facing negative Y. Positive X is the driver's right. A front view marks bottom-centre active pixels as the origin and positive Z upward. Checkerboard placement is measured at a marked inner crossing, not the paper edge.</desc><rect width="1040" height="990" fill="#f6f8fb"/><g font-family="Segoe UI, Arial, sans-serif" fill="#172b40"><text x="36" y="48" font-size="34" fill="#14344f" font-weight="600">One origin for the whole rig</text><text x="36" y="85" font-size="23" fill="#172b40" font-weight="400">Cameras keep looking OUTWARD. They do not need to look at the LCD.</text><rect x="32" y="108" width="586" height="510" rx="12" fill="white" stroke="#b8c8d9" stroke-width="2"/><text x="52" y="144" font-size="24" fill="#35608a" font-weight="600">TOP VIEW (looking down)</text><path d="M80 354H568" stroke="#168fa5" stroke-width="10"/><circle cx="320" cy="354" r="8" fill="#ef8d2e"/><text x="355" y="387" font-size="22" fill="#137486" font-weight="600">LCD plane: Y = 0</text><text x="62" y="391" font-size="23" fill="#172b40" font-weight="400">Driver side: negative Y</text><text x="63" y="188" font-size="23" fill="#172b40" font-weight="400">Road side: positive Y</text><text x="411" y="190" font-size="20" fill="#725089">Road board</text><path d="M320 354L320 220" stroke="#35608a" stroke-width="4"/><path d="M320 220L314 232L326 232z" fill="#35608a"/><text x="334" y="239" font-size="25" fill="#35608a" font-weight="600">+Y</text><path d="M320 354L535 354" stroke="#35608a" stroke-width="4"/><path d="M535 354L523 348L523 360z" fill="#35608a"/><text x="536" y="341" font-size="25" fill="#35608a" font-weight="600">+X</text><rect x="210" y="311" width="40" height="29" rx="4" fill="#4779bd"/><rect x="389" y="311" width="40" height="29" rx="4" fill="#4779bd"/><path d="M230 311L230 258" stroke="#35608a" stroke-width="4"/><path d="M230 258L224 270L236 270z" fill="#35608a"/><path d="M409 311L409 258" stroke="#35608a" stroke-width="4"/><path d="M409 258L403 270L415 270z" fill="#35608a"/><text x="72" y="295" font-size="19" fill="#172b40" font-weight="400">Road LEFT</text><text x="438" y="294" font-size="19" fill="#172b40" font-weight="400">Road RIGHT</text><rect x="300" y="403" width="40" height="29" rx="4" fill="#4779bd"/><path d="M320 432L320 473" stroke="#35608a" stroke-width="4"/><path d="M320 473L326 461L314 461z" fill="#35608a"/><text x="353" y="430" font-size="22" fill="#172b40" font-weight="400">Driver camera</text><path d="M100 205H540" stroke="#725089" stroke-width="8"/><path d="M190 532H450" stroke="#725089" stroke-width="8"/><text x="78" y="589" font-size="22" fill="#4e6174" font-weight="400">Stand on the DRIVER side to decide left / right.</text><text x="188" y="566" font-size="19" fill="#725089" font-weight="400">Printed face toward driver camera.</text><text x="63" y="217" font-size="19" fill="#172b40" font-weight="400"></text><rect x="640" y="108" width="368" height="510" rx="12" fill="white" stroke="#b8c8d9" stroke-width="2"/><text x="662" y="144" font-size="24" fill="#35608a" font-weight="600">FRONT VIEW</text><text x="662" y="175" font-size="20" fill="#172b40" font-weight="400">From the driver, facing road</text><rect x="689" y="236" width="270" height="192" fill="#e8f2f8" stroke="#168fa5" stroke-width="4"/><path d="M824 236V428" stroke="#c1d4df" stroke-dasharray="7 5" stroke-width="2"/><circle cx="824" cy="428" r="8" fill="#ef8d2e"/><path d="M824 428L824 205" stroke="#35608a" stroke-width="4"/><path d="M824 205L818 217L830 217z" fill="#35608a"/><text x="838" y="217" font-size="21" fill="#35608a" font-weight="600">+Z (up)</text><path d="M824 428L982 428" stroke="#35608a" stroke-width="4"/><path d="M982 428L970 422L970 434z" fill="#35608a"/><text x="938" y="459" font-size="22" fill="#35608a" font-weight="600">+X</text><text x="660" y="499" font-size="23" fill="#8b4614" font-weight="600">ORIGIN = bottom-centre</text><text x="660" y="532" font-size="23" fill="#8b4614" font-weight="600">of the ACTIVE pixel area.</text><text x="660" y="574" font-size="21" fill="#172b40" font-weight="400">Not the outer frame edge.</text><rect x="32" y="642" width="976" height="278" rx="12" fill="white" stroke="#b8c8d9" stroke-width="2"/><text x="52" y="678" font-size="25" fill="#35608a" font-weight="600">MEASURE THE MARKED FIRST INNER CORNER</text><rect x="66" y="701" width="240" height="180" fill="white" stroke="#9aaab8" stroke-width="2"/><rect x="86" y="721" width="20" height="20" fill="#172b40"/><rect x="106" y="721" width="20" height="20" fill="white"/><rect x="126" y="721" width="20" height="20" fill="#172b40"/><rect x="146" y="721" width="20" height="20" fill="white"/><rect x="166" y="721" width="20" height="20" fill="#172b40"/><rect x="186" y="721" width="20" height="20" fill="white"/><rect x="206" y="721" width="20" height="20" fill="#172b40"/><rect x="226" y="721" width="20" height="20" fill="white"/><rect x="246" y="721" width="20" height="20" fill="#172b40"/><rect x="266" y="721" width="20" height="20" fill="white"/><rect x="86" y="741" width="20" height="20" fill="white"/><rect x="106" y="741" width="20" height="20" fill="#172b40"/><rect x="126" y="741" width="20" height="20" fill="white"/><rect x="146" y="741" width="20" height="20" fill="#172b40"/><rect x="166" y="741" width="20" height="20" fill="white"/><rect x="186" y="741" width="20" height="20" fill="#172b40"/><rect x="206" y="741" width="20" height="20" fill="white"/><rect x="226" y="741" width="20" height="20" fill="#172b40"/><rect x="246" y="741" width="20" height="20" fill="white"/><rect x="266" y="741" width="20" height="20" fill="#172b40"/><rect x="86" y="761" width="20" height="20" fill="#172b40"/><rect x="106" y="761" width="20" height="20" fill="white"/><rect x="126" y="761" width="20" height="20" fill="#172b40"/><rect x="146" y="761" width="20" height="20" fill="white"/><rect x="166" y="761" width="20" height="20" fill="#172b40"/><rect x="186" y="761" width="20" height="20" fill="white"/><rect x="206" y="761" width="20" height="20" fill="#172b40"/><rect x="226" y="761" width="20" height="20" fill="white"/><rect x="246" y="761" width="20" height="20" fill="#172b40"/><rect x="266" y="761" width="20" height="20" fill="white"/><rect x="86" y="781" width="20" height="20" fill="white"/><rect x="106" y="781" width="20" height="20" fill="#172b40"/><rect x="126" y="781" width="20" height="20" fill="white"/><rect x="146" y="781" width="20" height="20" fill="#172b40"/><rect x="166" y="781" width="20" height="20" fill="white"/><rect x="186" y="781" width="20" height="20" fill="#172b40"/><rect x="206" y="781" width="20" height="20" fill="white"/><rect x="226" y="781" width="20" height="20" fill="#172b40"/><rect x="246" y="781" width="20" height="20" fill="white"/><rect x="266" y="781" width="20" height="20" fill="#172b40"/><rect x="86" y="801" width="20" height="20" fill="#172b40"/><rect x="106" y="801" width="20" height="20" fill="white"/><rect x="126" y="801" width="20" height="20" fill="#172b40"/><rect x="146" y="801" width="20" height="20" fill="white"/><rect x="166" y="801" width="20" height="20" fill="#172b40"/><rect x="186" y="801" width="20" height="20" fill="white"/><rect x="206" y="801" width="20" height="20" fill="#172b40"/><rect x="226" y="801" width="20" height="20" fill="white"/><rect x="246" y="801" width="20" height="20" fill="#172b40"/><rect x="266" y="801" width="20" height="20" fill="white"/><rect x="86" y="821" width="20" height="20" fill="white"/><rect x="106" y="821" width="20" height="20" fill="#172b40"/><rect x="126" y="821" width="20" height="20" fill="white"/><rect x="146" y="821" width="20" height="20" fill="#172b40"/><rect x="166" y="821" width="20" height="20" fill="white"/><rect x="186" y="821" width="20" height="20" fill="#172b40"/><rect x="206" y="821" width="20" height="20" fill="white"/><rect x="226" y="821" width="20" height="20" fill="#172b40"/><rect x="246" y="821" width="20" height="20" fill="white"/><rect x="266" y="821" width="20" height="20" fill="#172b40"/><rect x="86" y="841" width="20" height="20" fill="#172b40"/><rect x="106" y="841" width="20" height="20" fill="white"/><rect x="126" y="841" width="20" height="20" fill="#172b40"/><rect x="146" y="841" width="20" height="20" fill="white"/><rect x="166" y="841" width="20" height="20" fill="#172b40"/><rect x="186" y="841" width="20" height="20" fill="white"/><rect x="206" y="841" width="20" height="20" fill="#172b40"/><rect x="226" y="841" width="20" height="20" fill="white"/><rect x="246" y="841" width="20" height="20" fill="#172b40"/><rect x="266" y="841" width="20" height="20" fill="white"/><circle cx="106" cy="741" r="8" fill="#ef8d2e" stroke="white" stroke-width="2"/><path d="M342 732L115 741" stroke="#c16c1c" stroke-width="3"/><path d="M115 741L127.22827823558407 746.5198923352852L126.75288080957864 734.5293128127039z" fill="#c16c1c"/><text x="356" y="732" font-size="23" fill="#8b4614" font-weight="600">This crossing, not the paper corner.</text><text x="356" y="771" font-size="21" fill="#172b40" font-weight="400">The numbered preview must mark your physical corner 1.</text><text x="356" y="808" font-size="21" fill="#172b40" font-weight="400">At zero board rotation: road columns → +X;</text><text x="356" y="840" font-size="21" fill="#172b40" font-weight="400">driver columns → −X. Both have rows down → −Z.</text><text x="356" y="883" font-size="20" fill="#4e6174" font-weight="400">If numbering is wrong: Undo, reverse order, capture again.</text><text x="40" y="959" font-size="21" fill="#4e6174" font-weight="400">Road board printed face points back toward road cameras. Driver board faces its camera.</text></g></svg>

