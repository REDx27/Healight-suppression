<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="914" viewBox="0 0 1040 914" role="img" aria-labelledby="title desc">
<title id="title">Offline calibration sequence</title><desc id="desc">Four stages for Fully Auto: road calibration, driver and optional ToF, measured installed-rig and LCD calibration, then independent physical verification. Fitting, passing and saving are different.</desc>
<rect width="1040" height="914" fill="#f6f8fb"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#172b40">
<text x="36" y="48" font-size="34" font-weight="600" fill="#14344f">Fully Auto: follow this order</text><text x="36" y="86" font-size="23" font-weight="400" fill="#172b40">Work on a bench. Complete each SAVE before moving to the next stage.</text><rect x="32" y="110" width="976" height="74" rx="12" fill="#ffffff" stroke="#b8c8d9" stroke-width="2"/><text x="54" y="141" font-size="21" font-weight="600" fill="#35608a">BEFORE STARTING</text><text x="54" y="169" font-size="23" font-weight="400" fill="#172b40">Label Driver / Road LEFT / Road RIGHT. Flat measured board. LCD in Extend mode.</text><rect x="32" y="214" width="474" height="190" rx="12" fill="#ffffff" stroke="#b8c8d9" stroke-width="2"/><text x="54" y="248" font-size="25" font-weight="600" fill="#35608a">1   ROAD CAMERAS</text><text x="54" y="286" font-size="24" font-weight="400" fill="#172b40">LEFT: 15+ varied sharp views → fit</text><text x="54" y="324" font-size="24" font-weight="400" fill="#172b40">RIGHT: 15+ varied sharp views → fit</text><text x="54" y="362" font-size="24" font-weight="400" fill="#172b40">Both: 15+ still pairs → fit → SAVE</text><text x="54" y="390" font-size="21" font-weight="400" fill="#4e6174">Remove dark filters for this stage.</text><rect x="534" y="214" width="474" height="190" rx="12" fill="#ffffff" stroke="#b8c8d9" stroke-width="2"/><text x="556" y="248" font-size="25" font-weight="600" fill="#35608a">2   DRIVER CAMERA</text><text x="556" y="286" font-size="24" font-weight="400" fill="#172b40">15+ varied sharp views → fit</text><text x="556" y="324" font-size="24" font-weight="400" fill="#172b40">Fit passed? Select SAVE camera.</text><text x="556" y="362" font-size="22" font-weight="400" fill="#172b40">No ToF controller / bridge firmware?</text><text x="556" y="390" font-size="21" font-weight="400" fill="#7b4514">Skip ToF; use measured fixed distance.</text><path d="M520 414v20" stroke="#4779bd" stroke-width="4"/><path d="M513 430l7 10 7-10z" fill="#4779bd"/><rect x="32" y="450" width="976" height="150" rx="12" fill="#ffffff" stroke="#b8c8d9" stroke-width="2"/><text x="54" y="485" font-size="25" font-weight="600" fill="#35608a">3   INSTALLED RIG + LCD</text><text x="54" y="522" font-size="23" font-weight="400" fill="#172b40">Fix the final cameras / filters. Measure board positions from the LCD origin.</text><text x="54" y="556" font-size="23" font-weight="400" fill="#172b40">Camera poses: 6 fit + 3 new check placements. LCD: 6 fit + 3 new check marks.</text><text x="54" y="588" font-size="23" font-weight="400" fill="#172b40">Every required tab passed? SAVE the installed-rig profile.</text><path d="M520 610v20" stroke="#4779bd" stroke-width="4"/><path d="M513 626l7 10 7-10z" fill="#4779bd"/><rect x="32" y="646" width="976" height="123" rx="12" fill="#ffffff" stroke="#b8c8d9" stroke-width="2"/><text x="54" y="681" font-size="25" font-weight="600" fill="#35608a">4   VERIFY ON THE BENCH</text><text x="54" y="716" font-size="23" font-weight="400" fill="#172b40">Confirm camera order and unchanged mounts. Check the three camera markers.</text><text x="54" y="750" font-size="23" font-weight="400" fill="#172b40">Compare real light-to-eye crossings with LCD spots. Record error and timing.</text><rect x="32" y="798" width="976" height="92" rx="12" fill="#ffffff" stroke="#b8c8d9" stroke-width="2"/><text x="54" y="833" font-size="26" font-weight="600" fill="#8b4614">FIT ≠ SAVE       PASSED ≠ physically accurate</text><text x="54" y="868" font-size="22" font-weight="400" fill="#172b40">A fit calculates. A pass checks a limit. Save keeps it. Real measurements verify it.</text>
</g></svg>

