<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="904" viewBox="0 0 1040 904" role="img" aria-labelledby="title desc"><title id="title">Conditional ToF wiring for Uno R3 or classic Nano</title><desc id="desc">Connect by printed pin names, not physical pin order. VIN requires a verified breakout supply rail; GND goes to ground, SCL to A5 and SDA to A4 on a classic Uno or Nano. I2C level shifting may be required because these controllers use 5 volt logic. A USB laptop link needs compatible GlareTracker bridge-v1 firmware.</desc><rect width="1040" height="904" fill="#f6f8fb"/><g font-family="Segoe UI, Arial, sans-serif" fill="#172b40"><text x="36" y="48" font-size="32" fill="#14344f" font-weight="600">ToF wiring: follow LABELS, not pin positions</text><text x="36" y="86" font-size="22" fill="#172b40" font-weight="400">Example controller: classic Arduino Uno R3 or classic Nano. Other boards differ.</text><rect x="50" y="262" width="274" height="324" rx="12" fill="#e7f2fb" stroke="#4779bd" stroke-width="2"/><text x="70" y="300" font-size="25" fill="#35608a" font-weight="600">VL53L0X breakout</text><text x="70" y="332" font-size="21" fill="#172b40" font-weight="400">Your module: four pins</text><rect x="642" y="262" width="344" height="324" rx="12" fill="#edf3e9" stroke="#6d8a58" stroke-width="2"/><text x="662" y="301" font-size="23" fill="#496b38" font-weight="600">UNO R3 / classic NANO</text><rect x="680" y="116" width="260" height="96" rx="12" fill="white" stroke="#b8c8d9" stroke-width="2"/><text x="701" y="153" font-size="24" fill="#35608a" font-weight="600">Laptop USB</text><text x="701" y="185" font-size="21" fill="#172b40" font-weight="400">Power + serial link</text><path d="M814 212V262" stroke="#4779bd" stroke-width="6"/><path d="M808 250l6 12 6-12z" fill="#4779bd"/><text x="249" y="376" font-size="24" fill="#b44546" font-weight="600">VIN</text><circle cx="324" cy="368" r="6" fill="#b44546"/><path d="M330 368H642" stroke="#b44546" stroke-width="4"/><text x="660" y="376" font-size="22" fill="#b44546" font-weight="600">Verified supply rail</text><text x="249" y="434" font-size="24" fill="#495763" font-weight="600">GND</text><circle cx="324" cy="426" r="6" fill="#495763"/><path d="M330 426H642" stroke="#495763" stroke-width="4"/><text x="660" y="434" font-size="22" fill="#495763" font-weight="600">GND</text><text x="249" y="492" font-size="24" fill="#af791b" font-weight="600">SCL</text><circle cx="324" cy="484" r="6" fill="#af791b"/><path d="M330 484H394M610 484H642" stroke="#af791b" stroke-width="4"/><text x="660" y="492" font-size="22" fill="#af791b" font-weight="600">A5 / SCL</text><text x="249" y="550" font-size="24" fill="#397db9" font-weight="600">SDA</text><circle cx="324" cy="542" r="6" fill="#397db9"/><path d="M330 542H394M610 542H642" stroke="#397db9" stroke-width="4"/><text x="660" y="550" font-size="22" fill="#397db9" font-weight="600">A4 / SDA</text><rect x="394" y="455" width="216" height="108" rx="12" fill="#fff4dc" stroke="#c18b32" stroke-width="2"/><text x="412" y="484" font-size="21" fill="#845c15" font-weight="600">I2C logic-level</text><text x="412" y="514" font-size="20" fill="#845c15" font-weight="600">adapter if required</text><text x="412" y="545" font-size="19" fill="#845c15" font-weight="400">Verify the breakout.</text><rect x="32" y="616" width="976" height="106" rx="12" fill="#fff4dc" stroke="#c18b32" stroke-width="2"/><text x="52" y="651" font-size="25" fill="#845c15" font-weight="600">STOP: check the exact breakout's voltage specification first.</text><text x="52" y="686" font-size="23" fill="#845c15" font-weight="400">Uno / classic Nano logic is 5 V. A bare VL53L0X is NOT a 5 V device.</text><text x="46" y="762" font-size="23" fill="#172b40" font-weight="400">1  Disconnect USB before wiring. Read each label printed on the module.</text><text x="46" y="798" font-size="23" fill="#172b40" font-weight="400">2  Verify VIN range AND SDA/SCL logic compatibility; add level shifting if needed.</text><text x="46" y="834" font-size="23" fill="#172b40" font-weight="400">3  Use GlareTracker bridge-v1 firmware. A distance-printing demo is not compatible.</text><text x="46" y="870" font-size="22" fill="#8b4614" font-weight="600">No controller or bridge firmware yet? Use Skip ToF + a measured fixed distance.</text></g></svg>

